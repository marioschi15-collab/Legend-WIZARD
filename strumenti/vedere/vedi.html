<!doctype html><html><body style="margin:0"><canvas id="c"></canvas>
<!-- Il visore delle scene fatte con Blender: le mostra fuori dal gioco, in pochi secondi, con la luce che si vuole.
     Si usa con vedi.cjs (lì c'è scritto come). Parametri nell'indirizzo: s (nome del file della scena), t (il terreno
     di anteprima), cam e mira (x,y,z: da dove e verso dove si guarda; x = est, y = alto, z = sud, dal centro della zona),
     fov, cielo, nebbia, alta, bassa, amb, sole, forza, dasole (la luce), acqua (colore dell'acqua, se c'è). -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') ?? 1280), H = +(Q.get('h') ?? 720);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(W, H, false);

const c = sole.shadow.camera; c.left = c.bottom = -90; c.right = c.top = 90; c.far = 400; sole.shadow.bias = -0.0005; s.add(sole); s.add(sole.target);
const IMG = new Set(['muro','pietra','muschio','tetto','legno','corteccia','terra','ciottoli','intonaco','tegole','neve','tela','tavole','vetrata','blocchi','lastre','rupe']);

(async () => {

    else if (n === 'cristallo') { o.material = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.5, 0.75, 2.4), vertexColors: true }); o.castShadow = false; }
    else if (n === 'cascata') { o.material = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.75, 1.15, 1.25), transparent: true, opacity: 0.85, side: THREE.DoubleSide }); o.castShadow = false; }
    else { o.material = new THREE.MeshLambertMaterial({ map: IMG.has(n) ? img(n) : null, color: IMG.has(n) ? 0xffffff : m.color, vertexColors: !!o.geometry.attributes.color, side: n === 'rametti' || n === 'terreno' ? THREE.DoubleSide : THREE.FrontSide, alphaTest: n === 'rametti' ? 0.35 : 0 }); if (n === 'rametti') o.castShadow = false; }

</script></body></html>
